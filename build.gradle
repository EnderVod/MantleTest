/*
 * Mantle
 * NeoForge 1.21.1 build
 */

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'io.freefair.lombok' version '8.14.2'
}

repositories {
    mavenCentral()
    maven {
        name = "Prog's Maven"
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
}

group = mod_group_id
base {
    archivesName = 'Mantle'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the SlimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        ext.revision = proc.exitValue() == 0 ? proc.text.trim() : "GITBORK"
    } catch (all) {
        ext.revision = "gitgud"
    }

    ext.buildNum = System.getenv().BUILD_NUMBER != null ? "${System.getenv().BUILD_NUMBER}" : "DEV.${project.buildInfo.revision}"
}

ext.artifact_version = System.getenv().ARTIFACT_VERSION != null ? System.getenv().ARTIFACT_VERSION : "${mod_version}.${project.buildInfo.buildNum}"
version = "${minecraft_version}-${artifact_version}"

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {}

    server {
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', 'mantle', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        version: artifact_version,
        loader_range: loader_range,
        minecraft_range: minecraft_range,
        neo_version: neo_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Mantle',
            'Specification-Vendor': 'Slime Knights',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor': 'Slime Knights',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar).configure {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
