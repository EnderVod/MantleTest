name: Mantle 1.21.1 Server Smoke Test

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-server-smoke.yml
      - src/main/java/**
      - src/main/resources/**
      - src/generated/resources/**
      - build.gradle
      - gradle.properties
      - settings.gradle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Mantle port
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare development server
        run: |
          mkdir -p run/server
          echo 'eula=true' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          level-name=world
          max-players=1
          view-distance=3
          simulation-distance=3
          EOF

      - name: Boot dedicated server
        shell: bash
        run: |
          set +e
          timeout --signal=INT 240s ./gradlew runServer --no-daemon > server-console.log 2>&1
          status=$?
          set -e

          if grep -Eq 'Done \([0-9.]+s\)!|Done \(' run/server/logs/latest.log server-console.log 2>/dev/null; then
            echo 'Dedicated server reached the ready state successfully.'
            exit 0
          fi

          echo "Server did not reach ready state (command status: $status)."
          echo '--- server console tail ---'
          tail -n 250 server-console.log || true
          echo '--- latest.log tail ---'
          tail -n 250 run/server/logs/latest.log || true
          exit 1
