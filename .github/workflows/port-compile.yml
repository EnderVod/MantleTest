name: Mantle 1.21.1 Port Build

on:
  push:
    branches:
      - 1.21.1-neoforge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Mantle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantle-1.21.1-neoforge
          path: build/libs/*.jar
          if-no-files-found: error
