name: Mantle 1.21.1 Port Compile

on:
  push:
    branches:
      - 1.21.1-neoforge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Java
        run: ./gradlew compileJava --stacktrace --no-daemon
