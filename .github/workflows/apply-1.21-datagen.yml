name: Apply Mantle 1.21.1 generated resources

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/apply-1.21-datagen.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Mantle port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Regenerate 1.21.1 data
        run: ./gradlew runData --stacktrace --no-daemon

      - name: Exclude datagen cache churn
        run: git restore src/generated/resources/.cache || true

      - name: Commit generated resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/generated/resources
          git reset -- src/generated/resources/.cache || true
          if git diff --cached --quiet; then
            echo 'Generated resources already match 1.21.1 output.'
            exit 0
          fi
          git commit -m "Regenerate Mantle resources for Minecraft 1.21.1"
          git push origin HEAD:1.21.1-neoforge
