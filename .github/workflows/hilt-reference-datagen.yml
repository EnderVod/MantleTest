name: Hilt-translated Mantle datagen check

on:
  push:
    branches:
      - 1.21.1-hilt-reference
    paths:
      - .github/workflows/hilt-reference-datagen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout translated branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-hilt-reference

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run data generators
        run: ./gradlew runData --stacktrace --no-daemon

      - name: Show generated resource changes
        if: always()
        run: git status --short src/generated/resources || true
