name: Apply proven 1.21.1 Mantle source port

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/apply-hilt-port.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Mantle port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Fetch Hilt 1.21.1 reference
        run: git clone --depth 1 --branch 'Neo/1.21.1' https://github.com/Modern-Mods/Hilt.git /tmp/hilt

      - name: Translate Hilt implementation back to Mantle API names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('/tmp/hilt/src/main/java/modernmods/hilt')
          target = Path('src/main/java/slimeknights/mantle')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)

          copied = 0
          for src in source.rglob('*.java'):
              rel = src.relative_to(source)
              rel_parts = [part.replace('Hilt', 'Mantle') for part in rel.parts]
              dst = target.joinpath(*rel_parts)
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = src.read_text(encoding='utf-8')
              text = text.replace('modernmods.hilt', 'slimeknights.mantle')
              text = text.replace('HILT', 'MANTLE')
              text = text.replace('Hilt', 'Mantle')
              text = text.replace('hilt', 'mantle')
              dst.write_text(text, encoding='utf-8')
              copied += 1

          hilt_at = Path('/tmp/hilt/src/main/resources/META-INF/accesstransformer.cfg')
          mantle_at = Path('src/main/resources/META-INF/accesstransformer.cfg')
          if hilt_at.is_file():
              mantle_at.parent.mkdir(parents=True, exist_ok=True)
              mantle_at.write_text(hilt_at.read_text(encoding='utf-8'), encoding='utf-8')

          print(f'Translated {copied} Hilt-lineage Java files to Mantle names')
          PY

      - name: Add port attribution
        shell: bash
        run: |
          cat > PORTING-1.21.1.md <<'EOF'
          # Mantle 1.21.1 NeoForge port

          This branch ports Mantle to Minecraft 1.21.1 and NeoForge.

          The source-level API migration uses the MIT-licensed Modern-Mods/Hilt
          `Neo/1.21.1` implementation as a reference and implementation lineage.
          Hilt itself carries forward Mantle architecture while adapting it to
          modern NeoForge APIs. Mantle package names, mod ID, and project identity
          are retained here for compatibility with SlimeKnights/TinkersConstruct.

          Reference: https://github.com/Modern-Mods/Hilt/tree/Neo/1.21.1
          Original Mantle: https://github.com/SlimeKnights/Mantle
          EOF

      - name: Commit proven source port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources/META-INF/accesstransformer.cfg PORTING-1.21.1.md
          if ! git diff --cached --quiet; then
            git commit -m "Port Mantle source to NeoForge 1.21.1 using Hilt lineage"
            git push origin HEAD:1.21.1-neoforge
          fi
