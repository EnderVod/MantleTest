name: Apply NeoForge namespace migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/namespace-port.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Convert Forge package namespaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java')
          changed = 0
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text
              updated = updated.replace('net.minecraftforge.api.distmarker.', 'net.neoforged.api.distmarker.')
              updated = updated.replace('net.minecraftforge.eventbus.api.', 'net.neoforged.bus.api.')
              updated = updated.replace('net.minecraftforge.fml.', 'net.neoforged.fml.')
              updated = updated.replace('net.minecraftforge.', 'net.neoforged.neoforge.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} Java files')
          PY

      - name: Commit namespace migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No namespace changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          git commit -m "Port Forge package imports to NeoForge"
          git push origin HEAD:1.21.1-neoforge

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile migrated sources
        run: ./gradlew compileJava --stacktrace --no-daemon
